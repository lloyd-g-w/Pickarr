# Build the Pickarr image and publish it to GitHub Container Registry so that
# Portainer / Docker Compose users can pull ghcr.io/lloyd-g-w/pickarr instead
# of building locally.
#
# Tags produced:
#   ghcr.io/lloyd-g-w/pickarr:latest   - every push to main
#   ghcr.io/lloyd-g-w/pickarr:sha-xxxx - every push
#   ghcr.io/lloyd-g-w/pickarr:v1.2.3   - on git tags v*
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pickarr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Add linux/arm64 here if you need Raspberry Pi / Apple Silicon
          # hosts; the OCaml dependency build under QEMU takes ~1h.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

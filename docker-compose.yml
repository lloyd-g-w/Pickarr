# Minimal Pickarr stack: `docker compose up -d` and open http://localhost:8484
#
# Everything else (Sonarr/Radarr instances, LLM, rules, preferences) is
# configured in the UI. The .env file is optional; see .env.example.
services:
  pickarr:
    # Prebuilt image from GHCR; `docker compose build` still works because
    # the build context is declared too.
    image: ghcr.io/lloyd-g-w/pickarr:latest
    build: .
    container_name: pickarr
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      # Config, selection history and credentials. The container fixes the
      # ownership to PUID:PGID on start.
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Run as this uid/gid (owner of ./data), like the *arr images.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
